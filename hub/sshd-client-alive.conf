# /etc/ssh/sshd_config.d/10-fleet-client-alive.conf on the hub.
#
# Each node's relay tunnel holds a reverse forward on the hub (127.0.0.1:<its port>).
# When a node vanishes without closing its session (sleep, cable pulled, network change),
# sshd keeps that port bound until it notices. With ClientAliveInterval 0 (a common
# default) that is left to TCP keepalive, about 2h11m, and until then the node's reconnect
# fails with "remote port forwarding failed". This reaps a dead session in about 60s.
#
# Named 10- so it is read before e.g. 50-cloud-init.conf: sshd keeps the FIRST value it
# sees. Verify with:  sudo sshd -T | grep -i clientalive
ClientAliveInterval 15
ClientAliveCountMax 4
